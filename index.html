<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#020714"><title>JARVIS - puheohjattu testi</title><style>
*{box-sizing:border-box}body{margin:0;background:#020714;color:#cbfaff;font:16px system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center}header{text-align:center;padding:12px 10px 2px}h1{margin:0;color:#89efff;letter-spacing:5px;font-size:23px}p{font-size:12px;color:#9ebfce;margin:6px}#stage{position:relative;width:min(100vw,450px);aspect-ratio:1;background:radial-gradient(circle at 50% 50%,#09233d,#020714 65%);overflow:hidden;touch-action:manipulation}#stage.pyramid{background:#000}canvas{width:100%;height:100%;display:block}#ui{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 8px;max-width:500px}button{border:1px solid #3ac5f0;border-radius:8px;padding:11px 12px;background:#063151;color:white;font-weight:650;font-size:13px}button:active{background:#17668c}.active{background:#196a89}#status{padding:5px 12px 16px;font-size:12px;text-align:center;color:#b3d2db;min-height:36px}footer{font-size:11px;opacity:.75;text-align:center;padding:0 12px 25px}.hide{display:none}
/* JARVIS mobile UI polish */
:root{color-scheme:dark}
body{background:radial-gradient(ellipse 95% 53% at 50% 21%,#0a2942 0%,#020714 75%);padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
header{width:100%;padding:22px 14px 12px}
header h1{font-size:clamp(24px,6vw,36px);letter-spacing:.32em;text-shadow:0 0 22px #15cfff77}
header p{font-size:13px;letter-spacing:.09em;margin-top:10px}
#stage{width:min(94vw,480px);border-radius:24px;aspect-ratio:1;background:radial-gradient(circle at center,#113950 0%,#020714 72%);box-shadow:inset 0 0 45px #02b9ef12}
#ui{width:min(100%,500px);padding:12px 15px;gap:9px}
#ui button{min-height:46px;touch-action:manipulation;border-color:#36d6ff99;background:linear-gradient(155deg,#0b4260,#062437);box-shadow:0 3px 17px #00beff17;font-size:clamp(13px,3.4vw,15px);cursor:pointer}
#ui button:focus-visible,#ui select:focus-visible{outline:2px solid #9cfcff;outline-offset:3px}
#ui button.active{background:linear-gradient(155deg,#137c91,#095267);box-shadow:0 0 21px #25dfff50}
#ui label{color:#bae9f2;flex-wrap:wrap;justify-content:center}
#ui select{min-height:44px;max-width:min(65vw,240px)!important}
#status{width:min(95%,510px);font-size:14px;line-height:1.55;padding:10px 14px;word-break:break-word;min-height:50px}
#heard{max-width:95%;font-size:13px!important;line-height:1.5}
footer{max-width:510px;line-height:1.45;margin-top:10px;padding-bottom:22px}
@media(min-width:780px){#stage{width:410px}#ui{max-width:520px}}
@media(prefers-reduced-motion:reduce){button{transition:none!important}}
</style></head><body><header><h1>J.A.R.V.I.S.</h1><p>Hologrammi ja puheohjaus</p></header><div id="stage"><canvas id="cv" width="800" height="800" aria-label="Animoitu JARVIS-valohahmo"></canvas></div><div id="ui"><button id="listen">🎙 Aloita kuuntelu</button><button id="diag">🧪 Mikrofonitesti</button><button id="talk">🔊 Testaa ääni</button><button id="unlock">🔐 Adam-äänen avaus</button><label style="display:flex;align-items:center;gap:5px;font-size:12px">Puheääni <select id="voice" aria-label="Valitse puheääni" style="max-width:165px;background:#063151;color:white;border:1px solid #3ac5f0;border-radius:8px;padding:9px"></select></label><button id="mode">◇ Pyramiditila</button><button id="full">⛶ Koko näyttö</button><button id="update" type="button">↻ Päivitä ohjelma</button></div><div id="status" aria-live="polite">Aloita kuuntelu, sano sitten ”Jarvis”.</div><div id="heard" style="font-size:12px;color:#59d9ef;min-height:21px;text-align:center;padding:0 12px"></div><footer>Versio 1.3 • Puheohjaus toimii selaimen ollessa auki. Adam-ääni tarvitsee erillisen palvelinyhteyden ja toimivat käyttöoikeudet.</footer><script>
const c=document.getElementById('cv'),x=c.getContext('2d'),S=800;let pyramid=false,playing=false,start=Date.now();function line(points,a=1,w=3){x.strokeStyle=`rgba(84,231,255,${a})`;x.lineWidth=w;x.beginPath();points.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke()}function ellipse(cx,cy,rx,ry,a=1,w=2){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.strokeStyle=`rgba(51,210,255,${a})`;x.lineWidth=w;x.stroke()}function bot(t){x.save();x.shadowColor='#00cfff';x.shadowBlur=19;let bob=Math.sin(t*1.6)*6;x.translate(0,bob); // bust
x.fillStyle='rgba(0,158,255,.05)';x.beginPath();x.moveTo(-102,120);x.lineTo(-90,42);x.lineTo(-52,20);x.lineTo(-38,-8);x.lineTo(38,-8);x.lineTo(52,20);x.lineTo(90,42);x.lineTo(102,120);x.closePath();x.fill();line([[-102,120],[-90,42],[-52,20],[-38,-8]],.92,3);line([[38,-8],[52,20],[90,42],[102,120]],.92,3);line([[-90,42],[-44,70],[0,99],[44,70],[90,42]],.7,2);line([[-42,15],[0,42],[42,15]],.5,2);
// neck
line([[-24,-15],[-25,-55]],.6,3);line([[24,-15],[25,-55]],.6,3);
// head
x.beginPath();x.moveTo(-40,-95);x.quadraticCurveTo(-48,-160,-13,-182);x.quadraticCurveTo(10,-191,36,-164);x.quadraticCurveTo(46,-128,38,-93);x.quadraticCurveTo(31,-70,4,-57);x.quadraticCurveTo(-30,-70,-40,-95);x.strokeStyle='rgba(106,235,255,.95)';x.lineWidth=3;x.stroke();line([[-35,-132],[-23,-126],[-9,-127]],.7,3);line([[9,-127],[23,-126],[35,-132]],.7,3);line([[-22,-123],[-9,-123]],1,4);line([[9,-123],[22,-123]],1,4);line([[-4,-104],[0,-91],[6,-101]],.5,2);line([[-12,-78],[0,-75],[12,-78]],.6,2);ellipse(0,47,21,21,.8,2);ellipse(0,47,12,12,.9,3);x.shadowBlur=0;for(let i=0;i<18;i++){let py=-160+i*15;let alpha=.035+(.035*Math.sin(t*2+i)) ;line([[-65,py],[65,py]],alpha,1)}x.restore()}
function hologram(cx,cy,scale,rot,t){x.save();x.translate(cx,cy);x.rotate(rot);x.scale(scale,scale);x.shadowColor='#03bdff';x.shadowBlur=15;ellipse(0,150,135,25,.75,4);ellipse(0,150,93,17,.5,2);ellipse(0,-10,118,23,.18,2);x.shadowBlur=0;bot(t);for(let i=0;i<25;i++){let a=i*2.399+t*.15,r=35+((i*41)%125),py=Math.sin(i*18+t)*65; x.fillStyle=`rgba(85,220,255,${.15+.22*Math.sin(t+i)**2})`;x.fillRect(Math.sin(a)*r,-65+py,2,2)}x.restore()}
function draw(now){let t=(Date.now()-start)/1000;x.clearRect(0,0,S,S);if(pyramid){x.fillStyle='#000';x.fillRect(0,0,S,S); // each face points toward the central pyramid aperture, leaving black cross
hologram(400,175,.63,Math.PI,t);hologram(400,625,.63,0,t);hologram(175,400,.63,Math.PI/2,t);hologram(625,400,.63,-Math.PI/2,t);
}else{let g=x.createRadialGradient(400,400,0,400,400,360);g.addColorStop(0,'#102d43');g.addColorStop(1,'#020714');x.fillStyle=g;x.fillRect(0,0,S,S);hologram(400,460,1.65,0,t)}requestAnimationFrame(draw)}if(window.requestAnimationFrame){requestAnimationFrame(draw)}else{setInterval(()=>draw(Date.now()),100)}
const msg=document.getElementById('status');
const heard=document.getElementById('heard');
const currentVersion='1.3';
document.getElementById('update').onclick=async()=>{
 const btn=document.getElementById('update');
 btn.disabled=true;
 msg.textContent='Tarkistetaan uusinta JARVIS-versiota...';
 try{
  const check=await fetch(new URL('index.html?check='+Date.now(),location.href),{cache:'no-store'});
  if(!check.ok)throw Error('Palvelin vastasi '+check.status);
  const html=await check.text();
  if(!html.includes('J.A.R.V.I.S.'))throw Error('Sivun sisältö ei ollut JARVIS');
  msg.textContent='Ladataan uusin ohjelmaversio...';
  const url=new URL(location.href);
  url.searchParams.set('v',String(Date.now()));
  location.replace(url.toString());
 }catch(e){
  msg.textContent='Päivitystä ei voitu tarkistaa. Tarkista internetyhteys: '+e.message;
  btn.disabled=false;
 }
};

const listenBtn=document.getElementById('listen');
const diagBtn=document.getElementById('diag');
const secure = window.isSecureContext || location.hostname === 'localhost';
if (!secure) { document.getElementById('status').textContent = 'Mikrofoni tarvitsee HTTPS-osoitteen. Avaa verkossa julkaistu versio.'; }
window.addEventListener('unhandledrejection',e=>{document.getElementById('status').textContent='Selaimen virhe: '+(e.reason?.message||String(e.reason))});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let listeningWanted=false,recognition=null,recognizing=false,speaking=false,dialogUntil=0,restartTimer=null;
// Androidin ja selaimen tarjoamat puheäänet vaihtelevat laitteittain.
const voiceSelect=document.getElementById('voice');
let availableVoices=[];
function refreshVoices(){
  if(!('speechSynthesis' in window))return;
  availableVoices=window.speechSynthesis.getVoices();
  const old=voiceSelect.value;
  voiceSelect.replaceChildren();
  availableVoices.forEach((v,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=v.name+' ('+v.lang+')';voiceSelect.append(o)});
  if(availableVoices.length===0){const o=document.createElement('option');o.textContent='Laitteen oletusääni';o.value='';voiceSelect.append(o);return}
  const male=/matti|onni|harri|heikki|pekka|jussi|male|man|masculine|henri|oliver|markus|samuli/i;
  const finnish=availableVoices.map((v,i)=>({v,i})).filter(o=>/^fi([-_]|$)/i.test(o.v.lang));
  const preferred=finnish.find(o=>male.test(o.v.name))||finnish[0]||availableVoices.map((v,i)=>({v,i})).find(o=>male.test(o.v.name))||{i:0};
  voiceSelect.value=old!==''&&availableVoices[Number(old)]?old:String(preferred.i);
}
if('speechSynthesis' in window){refreshVoices();window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices)}
// Asetetaan vasta, kun ElevenLabs-palvelin on julkaistu Renderiin.
const JARVIS_VOICE_ENDPOINT = 'https://jarvis-voice-9d66.onrender.com/speak';
let currentAudio=null;
let jarvisAccessToken='';
document.getElementById('unlock').onclick=()=>{
 const v=prompt('Syötä JARVIS:n oma käyttöavain (JARVIS_ACCESS_TOKEN). Älä syötä ElevenLabsin API-avainta.');
 if(v===null)return;
 jarvisAccessToken=v.trim();
 msg.textContent=jarvisAccessToken?'Adam-äänen käyttöavain asetettu tämän välilehden ajaksi.':'Käyttöavain poistettu.';
};
const say=async(text)=>{
  msg.textContent='JARVIS: '+text;
  speaking=true;
  if(recognition&&recognizing){try{recognition.stop()}catch(e){}}
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  const finish=()=>{speaking=false;if(listeningWanted)scheduleListen(450)};
  if(JARVIS_VOICE_ENDPOINT && jarvisAccessToken){
    try{
      const response=await fetch(JARVIS_VOICE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','X-Jarvis-Token':jarvisAccessToken},body:JSON.stringify({text})});
      if(!response.ok)throw new Error('Äänipalvelu ei vastaa ('+response.status+')');
      const blob=await response.blob();
      const url=URL.createObjectURL(blob);
      const audio=new Audio(url);currentAudio=audio;
      const done=()=>{URL.revokeObjectURL(url);if(currentAudio===audio)currentAudio=null;finish()};
      audio.onended=done;audio.onerror=done;
      await audio.play();return;
    }catch(e){msg.textContent='Adam-ääni ei ole käytettävissä; käytetään puhelimen ääntä. '+e.message;}
  }
  if(!('speechSynthesis' in window)){finish();return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='fi-FI';u.rate=.94;u.pitch=1;
  const selected=availableVoices[Number(voiceSelect.value)];
  if(selected){u.voice=selected;u.lang=selected.lang}
  u.onend=u.onerror=finish;
  window.speechSynthesis.speak(u);
};
function scheduleListen(delay=550){clearTimeout(restartTimer);restartTimer=setTimeout(()=>{if(listeningWanted&&!speaking&&!recognizing)startRecognition()},delay)}
function startRecognition(){
  if(!secure){msg.textContent='Avaa JARVIS HTTPS-osoitteessa mikrofonin käyttöä varten.';return}
  if(!SpeechRecognition){msg.textContent='Puheentunnistus ei ole käytettävissä tässä selaimessa. Kokeile Chromea HTTPS-osoitteessa.';return}
  if(recognizing||speaking||!listeningWanted)return;
  recognition=new SpeechRecognition();recognition.lang='fi-FI';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;
  recognition.onstart=()=>{recognizing=true;msg.textContent='Kuuntelen... sano ”Jarvis”.';listenBtn.textContent='⏹ Lopeta kuuntelu';listenBtn.classList.add('active')};
  recognition.onresult=e=>{let spoken=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();heard.textContent='Kuulin: '+spoken;handleSpeech(spoken)};
  recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listeningWanted=false;msg.textContent='Mikrofonin käyttö estetty. Avaa ohjelma HTTPS-osoitteessa ja salli mikrofoni.'}else if(e.error==='network'){listeningWanted=false;msg.textContent='Puheentunnistus tarvitsee verkkoyhteyden. Tarkista internet ja kokeile uudestaan.'}else if(e.error!=='no-speech'&&e.error!=='aborted'){msg.textContent='Mikrofonivirhe: '+e.error}};
  recognition.onend=()=>{recognizing=false;if(listeningWanted&&!speaking)scheduleListen(700);else if(!listeningWanted){listenBtn.textContent='🎙 Aloita kuuntelu';listenBtn.classList.remove('active')}};
  try{recognition.start()}catch(e){recognizing=false;msg.textContent='Puheentunnistus ei käynnistynyt: '+e.message}
}
function handleSpeech(spoken){
  const q=spoken.toLocaleLowerCase('fi-FI').replace(/[.,!?]/g,'').trim();
  const wake=/(^|\s)(jarvis|džarvis|järvis)(\s|$)/i.test(q);
  if(!wake&&Date.now()>dialogUntil)return;
  const task=q.replace(/.*?(jarvis|džarvis|järvis)\s*/i,'').trim();
  dialogUntil=Date.now()+15000;
  if(!task||task==='herää'||task==='hei')return say('Kyllä, kuuntelen. Miten voin auttaa?');
  if(task.includes('kello')||task.includes('aika'))return say('Kello on '+new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'}));
  if(task.includes('päivä')||task.includes('päivämäärä'))return say('Tänään on '+new Date().toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long'}));
  if(task.includes('kuka olet')||task.includes('mikä olet'))return say('Olen JARVIS, puheohjattava hologrammiavustajasi. Tämä on ensimmäinen testiversioni.');
  if(task.includes('pyramid')){pyramid=true;document.getElementById('mode').textContent='◉ Tavallinen näkymä';return say('Pyramiditila aktivoitu. Aseta heijastin näytölle.')}
  if(task.includes('normaali')||task.includes('tavallinen')){pyramid=false;document.getElementById('mode').textContent='◇ Pyramiditila';return say('Tavallinen näkymä aktivoitu.')}
  if(task.includes('lopeta')||task.includes('hiljaa')){listeningWanted=false;return say('Kuuntelu lopetettu.')}
  return say('Kuulin kysymyksesi, mutta tämä testiversio osaa vasta muutamia komentoja, kuten kellonaika ja pyramiditila.');
}
listenBtn.onclick=()=>{
  if(listeningWanted){listeningWanted=false;clearTimeout(restartTimer);if(recognition){try{recognition.abort()}catch(e){}}listenBtn.textContent='🎙 Aloita kuuntelu';listenBtn.classList.remove('active');msg.textContent='Kuuntelu pysäytetty.';return}
  if(!secure){msg.textContent='Avaa JARVIS HTTPS-osoitteessa. Paikallinen tiedosto ei anna mikrofonia käyttöön.';return}
  if(!SpeechRecognition){msg.textContent='Puheentunnistus ei ole käytettävissä täällä. Avaa Chromeen julkaistu HTTPS-versio.';return}
  listeningWanted=true;startRecognition()
};
diagBtn.onclick=async()=>{
  if(!secure){msg.textContent='Mikrofonitesti tarvitsee HTTPS-osoitteen.';return}
  if(!navigator.mediaDevices?.getUserMedia){msg.textContent='Selain ei tarjoa mikrofonitoimintoa. Käytä Chromea.';return}
  msg.textContent='Pyydetään mikrofonin käyttöoikeutta...';
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());msg.textContent='Mikrofoni sallittu. Paina Aloita kuuntelu ja sano Jarvis.';}catch(e){msg.textContent='Mikrofoni ei käynnistynyt: '+(e.name||e.message)+' – tarkista Chromen oikeudet.'}
};
document.getElementById('mode').onclick=()=>{pyramid=!pyramid;document.getElementById('mode').textContent=pyramid?'◉ Tavallinen näkymä':'◇ Pyramiditila';msg.textContent=pyramid?'Aseta heijastin näytön keskelle.':'Tavallinen hologramminäkymä.'};
document.getElementById('full').onclick=async()=>{if(!document.fullscreenElement){try{await document.documentElement.requestFullscreen()}catch(e){msg.textContent='Koko näyttö ei ole käytettävissä tässä selaimessa.'}}else document.exitFullscreen()};
document.getElementById('talk').onclick=()=>say('JARVIS aktivoitu. Puheohjaustesti on valmis. Paina aloita kuuntelu ja sano Jarvis.');
if(!SpeechRecognition)msg.textContent='Tämä selain ei tue puheentunnistusta. Kokeile Samsungin Chrome-selainta HTTPS-verkkosivulla.';
window.addEventListener('error',function(e){msg.textContent='Virhe: '+String(e.message||'Tuntematon virhe')});
</script></body></html>
